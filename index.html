
<!DOCTYPE html>

    <title>Smart To-Do List</title>

    <div class="container">

        <!-- Header -->
        <header class="header">
            <div class="title-box">
                <div class="icon">
                    <i class="fa-solid fa-clipboard-list"></i>
                </div>

                <div>
                    <h1>Smart To-Do List</h1>
                    <p>Organize your tasks and stay productive!</p>
                </div>
            </div>
        </header>


        <!-- Add Task -->
        <section class="add-task">

            <div class="input-group">
                <label>Task Title</label>
                <input type="text" placeholder="e.g. Study JavaScript" id="title">
            </div>

            <div class="input-group description">
                <label>Task Description</label>
                <input type="text"
                       placeholder="e.g. Learn DOM manipulation and Events" id="description">
            </div>

            <button class="add-btn" onclick="addtask()">
                <i class="fa-solid fa-plus"></i>
                Add Task
            </button>

        </section>


        <!-- Task Lists -->
        <section class="task-area">

            
            <div class="task-section" id="alltaskbox">

                <div class="section-heading">
                    <div class="heading-icon blue">
                        <i class="fa-solid fa-list"></i>
                    </div>

                    <h2>All Tasks</h2>
                    <span class="count blue-count" id="count-task"></span>
                </div>
